name: Publish Kling AI remote MCP metadata

on:
  workflow_dispatch:
    inputs:
      confirm_regions:
        description: 'Type global-and-china to publish both reviewed regional listings'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'klingai-dev/chatgpt-plugin' && github.ref == 'refs/heads/main' && inputs.confirm_regions == 'global-and-china'
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: global
            file: server.json
            name: io.github.klingai-dev/kling-ai
            version: 1.0.1
            endpoint: https://kling.ai/mcp/plugin
          - region: china
            file: registry/china/server.json
            name: io.github.klingai-dev/kling-ai-cn
            version: 1.0.0
            endpoint: https://klingai.com/mcp/plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v5
      - name: Check publishing identity and remote-only metadata
        env:
          METADATA_FILE: ${{ matrix.file }}
          EXPECTED_NAME: ${{ matrix.name }}
          EXPECTED_VERSION: ${{ matrix.version }}
          EXPECTED_ENDPOINT: ${{ matrix.endpoint }}
        run: |
          set -euo pipefail
          jq -e --arg name "$EXPECTED_NAME" --arg version "$EXPECTED_VERSION" --arg endpoint "$EXPECTED_ENDPOINT" '.name == $name and .version == $version and (.packages == null) and .remotes == [{"type":"streamable-http","url":$endpoint}]' "$METADATA_FILE"
          if [ "$METADATA_FILE" != "server.json" ]; then cp "$METADATA_FILE" server.json; fi
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish
